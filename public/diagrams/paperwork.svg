<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A1D17"/></marker></defs><rect width="820" height="560" fill="#FBF4E6"/><text x="32" y="44" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="2">RECORDS THAT ASK BEFORE THEY WRITE</text><rect x="40" y="80" width="220" height="110" rx="12" fill="#ACCAB2" stroke="#2A1D17" stroke-width="1.4"/><text x="58" y="106" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="1.5">AUTOMATION</text><text x="58" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">Monthly check</text><text x="58" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">each department's</text><text x="58" y="177" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">backup activity</text><path d="M260 135 L310 135" fill="none" stroke="#2A1D17" stroke-width="1.6" marker-end="url(#a)"/><rect x="315" y="80" width="220" height="110" rx="12" fill="#FFF9EE" stroke="#2A1D17" stroke-width="1.4"/><text x="333" y="106" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="1.5">PREPARED</text><text x="333" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">Draft entry</text><text x="333" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">for the quality</text><text x="333" y="177" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">register</text><path d="M535 135 L585 135" fill="none" stroke="#2A1D17" stroke-width="1.6" marker-end="url(#a)"/><rect x="590" y="80" width="190" height="110" rx="12" fill="#FFF9EE" stroke="#2A1D17" stroke-width="1.4"/><text x="608" y="106" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="1.5">BOT</text><text x="608" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">Preview</text><text x="608" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">posted to the</text><text x="608" y="177" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">IT chat</text><path d="M685 190 L685 240" fill="none" stroke="#2A1D17" stroke-width="1.6" marker-end="url(#a)"/><rect x="615" y="245" width="85.39999999999999" height="28" rx="14" fill="#E9A752" stroke="#2A1D17" stroke-width="1.2"/><text x="657.7" y="264" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#2A1D17" text-anchor="middle">Confirm</text><rect x="712" y="245" width="77.19999999999999" height="28" rx="14" fill="#FFF9EE" stroke="#2A1D17" stroke-width="1.2"/><text x="750.6" y="264" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#2A1D17" text-anchor="middle">Cancel</text><path d="M660 273 L660 318" fill="none" stroke="#2A1D17" stroke-width="1.6" marker-end="url(#a)"/><rect x="430" y="322" width="350" height="92" rx="12" fill="#E9A752" stroke="#2A1D17" stroke-width="1.4"/><text x="448" y="348" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="1.5">ONLY AFTER A YES</text><text x="448" y="374" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">Written to the register</text><text x="448" y="398" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">backup taken first · never over an open file</text><rect x="40" y="230" width="340" height="96" rx="12" fill="#FFF9EE" stroke="#2A1D17" stroke-width="1.4"/><text x="58" y="256" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="1.5">ALSO</text><text x="58" y="282" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">Tap an NFC tag on a computer</text><text x="58" y="306" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">→ its record from the asset register</text><rect x="40" y="342" width="340" height="96" rx="12" fill="#FFF9EE" stroke="#2A1D17" stroke-width="1.4"/><text x="58" y="368" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="1.5">ALSO</text><text x="58" y="394" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">New email arrives</text><text x="58" y="418" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">→ AI picks out IT requests, flags them</text><text x="410" y="470" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#BF3E1E" text-anchor="middle" font-style="italic">Less typing, fewer forgotten checks —</text><text x="410" y="492" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#BF3E1E" text-anchor="middle" font-style="italic">and a person still approves every change.</text></svg>
