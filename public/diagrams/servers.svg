<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A1D17"/></marker></defs><rect width="820" height="560" fill="#FBF4E6"/><text x="32" y="44" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="2">HOW THE SERVERS COVER FOR EACH OTHER</text><rect x="40" y="80" width="740" height="64" rx="12" fill="#ACCAB2" stroke="#2A1D17" stroke-width="1.4"/><text x="58" y="110" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">Staff across the factory</text><text x="58" y="134" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">files · ERP · internal tools</text><path d="M410 144 L410 196" fill="none" stroke="#2A1D17" stroke-width="1.6" marker-end="url(#a)"/><rect x="260" y="200" width="300" height="120" rx="12" fill="#E9A752" stroke="#2A1D17" stroke-width="1.4"/><text x="278" y="226" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="1.5">01 · IN USE</text><text x="278" y="252" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">Main server</text><text x="278" y="276" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">runs every core system</text><text x="278" y="297" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">built from an old desktop</text><path d="M260 290 L160 290 L160 386" fill="none" stroke="#2A1D17" stroke-width="1.6" marker-end="url(#a)"/><text x="150" y="360" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" font-weight="400" fill="#2A1D17" text-anchor="end">copy every 15 min</text><path d="M560 290 L660 290 L660 386" fill="none" stroke="#2A1D17" stroke-width="1.6" marker-end="url(#a)"/><text x="670" y="360" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" font-weight="400" fill="#2A1D17" text-anchor="start">backup every night</text><rect x="40" y="390" width="300" height="120" rx="12" fill="#FFF9EE" stroke="#2A1D17" stroke-width="1.4"/><text x="58" y="416" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="1.5">02 · READY</text><text x="58" y="442" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">Standby server</text><text x="58" y="466" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">holds a fresh copy</text><text x="58" y="487" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">can take over if main fails</text><rect x="480" y="390" width="300" height="120" rx="12" fill="#FFF9EE" stroke="#2A1D17" stroke-width="1.4"/><text x="498" y="416" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="1.5">03 · SAFE</text><text x="498" y="442" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">Backup server</text><text x="498" y="466" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">keeps daily, weekly and</text><text x="498" y="487" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">monthly copies · checked weekly</text><path d="M480 470 L342 470" fill="none" stroke="#5A4636" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="6 5"/><text x="411" y="492" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#5A4636" text-anchor="middle">tie-breaker vote</text><text x="410" y="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#BF3E1E" text-anchor="middle" font-style="italic">If the main server dies, at most 15 minutes of work is lost.</text></svg>
