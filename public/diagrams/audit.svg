<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A1D17"/></marker></defs><rect width="820" height="560" fill="#FBF4E6"/><text x="32" y="44" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="2">FROM PAPER FORMS TO AUDIT-READY</text><rect x="40" y="80" width="230" height="150" rx="12" fill="#FFF9EE" stroke="#2A1D17" stroke-width="1.4" stroke-dasharray="6 5"/><text x="58" y="106" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="1.5">SCATTERED</text><text x="58" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">Before</text><text x="58" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">paper forms</text><text x="58" y="177" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">files in many places</text><text x="58" y="198" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">slow to find</text><path d="M270 155 L325 155" fill="none" stroke="#2A1D17" stroke-width="1.6" marker-end="url(#a)"/><rect x="330" y="80" width="450" height="150" rx="12" fill="#ACCAB2" stroke="#2A1D17" stroke-width="1.4"/><text x="348" y="106" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="1.5">IATF 16949 · ISO 9001</text><text x="348" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">One digital library</text><text x="348" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">IT quality documents, nearly all digital</text><text x="348" y="177" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">searchable · history kept as logs</text><text x="348" y="198" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">one monthly summary instead of many signatures</text><path d="M555 230 L555 280" fill="none" stroke="#2A1D17" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="280" width="300" height="120" rx="12" fill="#FFF9EE" stroke="#2A1D17" stroke-width="1.4"/><text x="58" y="306" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="1.5">SELF-REVIEW</text><text x="58" y="332" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">Security checklist</text><text x="58" y="356" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">company reviewed against the</text><text x="58" y="377" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">automotive industry's checklist</text><path d="M340 340 L395 340" fill="none" stroke="#2A1D17" stroke-width="1.6" marker-end="url(#a)"/><rect x="400" y="280" width="380" height="120" rx="12" fill="#E9A752" stroke="#2A1D17" stroke-width="1.4"/><text x="418" y="306" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="1.5">RESULT</text><text x="418" y="332" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">First audit passed</text><text x="418" y="356" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">no action requests</text><path d="M590 400 L590 450" fill="none" stroke="#2A1D17" stroke-width="1.6" marker-end="url(#a)"/><rect x="400" y="454" width="380" height="76" rx="12" fill="#E8836A" stroke="#2A1D17" stroke-width="1.4"/><text x="418" y="484" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">Risk analysis + response plan</text><text x="418" y="508" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">from the auditor's recommendations</text><text x="210" y="480" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#BF3E1E" text-anchor="middle" font-style="italic">Ready for</text><text x="210" y="502" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#BF3E1E" text-anchor="middle" font-style="italic">next year's audit.</text></svg>
