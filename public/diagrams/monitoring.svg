<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A1D17"/></marker></defs><rect width="820" height="600" fill="#FBF4E6"/><text x="32" y="44" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="2">FOUR LAYERS THAT WATCH THE SERVERS</text><rect x="40" y="80" width="560" height="76" rx="12" fill="#ACCAB2" stroke="#2A1D17" stroke-width="1.4"/><text x="60" y="110" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="1.5">LAYER 1</text><text x="160" y="110" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">Services</text><text x="160" y="134" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A4636" text-anchor="start">25 checks, every minute</text><path d="M600 118 L650 118" fill="none" stroke="#2A1D17" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="172" width="560" height="76" rx="12" fill="#E9A752" stroke="#2A1D17" stroke-width="1.4"/><text x="60" y="202" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="1.5">LAYER 2</text><text x="160" y="202" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">Whole site</text><text x="160" y="226" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A4636" text-anchor="start">an outside service waits for a heartbeat — power cut or no internet</text><path d="M600 210 L650 210" fill="none" stroke="#2A1D17" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="264" width="560" height="76" rx="12" fill="#E8836A" stroke="#2A1D17" stroke-width="1.4"/><text x="60" y="294" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="1.5">LAYER 3</text><text x="160" y="294" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">Security</text><text x="160" y="318" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A4636" text-anchor="start">serious events from any computer</text><path d="M600 302 L650 302" fill="none" stroke="#2A1D17" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="356" width="560" height="76" rx="12" fill="#FFF9EE" stroke="#2A1D17" stroke-width="1.4"/><text x="60" y="386" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5A4636" text-anchor="start" letter-spacing="1.5">LAYER 4</text><text x="160" y="386" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">Server jobs</text><text x="160" y="410" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A4636" text-anchor="start">a backup or copy that failed</text><path d="M600 394 L650 394" fill="none" stroke="#2A1D17" stroke-width="1.6" marker-end="url(#a)"/><rect x="655" y="80" width="125" height="352" rx="12" fill="#2F4F4D"/><text x="717" y="240" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#FFF9EE" text-anchor="middle">One</text><text x="717" y="262" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#FFF9EE" text-anchor="middle">alert</text><text x="717" y="284" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#FFF9EE" text-anchor="middle">channel</text><rect x="40" y="460" width="560" height="80" rx="12" fill="#FFF9EE" stroke="#2A1D17" stroke-width="1.4" stroke-dasharray="6 5"/><text x="58" y="490" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#2A1D17" text-anchor="start">Every morning at 8:00</text><text x="58" y="514" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A4636" text-anchor="start">disk health · storage space · is every backup fresh?</text><path d="M600 500 L717 500 L717 436" fill="none" stroke="#2A1D17" stroke-width="1.6" marker-end="url(#a)"/><text x="410" y="580" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#BF3E1E" text-anchor="middle" font-style="italic">Quiet while everything is fine.</text></svg>
